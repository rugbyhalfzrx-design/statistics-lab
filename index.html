<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a63f16"><meta name="apple-mobile-web-app-capable" content="yes"><title>統計 Lab</title><style>
:root{--ink:#38261e;--muted:#765d50;--accent:#b74618;--light:#fff0df;--line:#eed9c8}*{box-sizing:border-box}body{margin:0;background:#fff7ed;color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}header{background:linear-gradient(125deg,#a63f16,#db671e);color:white;padding:26px max(18px,calc((100vw - 1050px)/2));padding-top:max(26px,env(safe-area-inset-top))}header h1{margin:0;font-size:30px}header p{margin:3px 0;font-size:14px;color:#ffe9d1}main{max-width:1080px;margin:auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px;padding:14px}nav,article,.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:15px}nav{align-self:start;position:sticky;top:10px;max-height:95vh;overflow:auto}nav h3{font-size:12px;color:var(--muted);margin:12px 0 3px}button,select,input{font:inherit}button,select{border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);padding:8px 12px;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #0e766e;outline-offset:2px}nav button{display:block;width:100%;text-align:left;border:0;font-size:14px;padding:7px}nav button.active{background:var(--light);color:var(--accent);font-weight:700}article{min-width:0}h2{font-size:25px;margin:0;line-height:1.4}h3{font-size:17px;margin:16px 0 5px}p{margin:8px 0}.tag{font-size:12px;font-weight:bold;color:var(--accent)}.formula{background:#fff4e8;padding:12px;border-radius:10px;font-family:ui-monospace,monospace;overflow-wrap:anywhere}.panel{padding:12px;margin:14px 0}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.control label{display:flex;justify-content:space-between;font-size:14px;font-weight:bold}.control input{width:100%;height:34px;accent-color:var(--accent);margin:0}.graph{display:block;width:100%;height:auto}.metrics{display:flex;flex-wrap:wrap;gap:7px}.metric{flex:1 1 100px;background:var(--light);padding:9px;border-radius:10px}.metric small{display:block;font-size:12px;color:var(--muted)}.metric strong{display:block;font-size:19px;font-variant-numeric:tabular-nums}.hint{border-left:3px solid #d96c27;padding-left:10px;color:var(--muted);font-size:14px}.quiz button{display:block;width:100%;text-align:left;margin:6px 0}.quiz button.good{background:#e2f4e9;border-color:#388b60}.quiz button.bad{background:#ffe1d4;border-color:#c24b26}.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:14px}.primary{background:var(--accent);color:white;border-color:var(--accent)}.progress{height:7px;background:#f6e2d1;border-radius:10px;overflow:hidden}.progress span{display:block;height:100%;background:#d96820}.mobile{display:none}footer{max-width:1080px;margin:auto;padding:0 15px 28px;color:var(--muted);font-size:12px}svg text{font:12px sans-serif;fill:#765d50}svg .grid{stroke:#f0e5d9}svg .axis{stroke:#987b68}svg .curve{fill:none;stroke:#bd4f19;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}svg .other{fill:none;stroke:#16776e;stroke-width:2.4;stroke-dasharray:6 4}@media(max-width:700px){main{display:block;padding:9px}nav{display:none}.mobile{display:block;margin-bottom:10px}.mobile select{width:100%}article{padding:13px}h2{font-size:23px}.controls{grid-template-columns:1fr 1fr}.metric strong{font-size:17px}}@media(max-width:350px){.controls{grid-template-columns:1fr}}</style></head><body><header><h1>統計 Lab <small style="font-size:12px">v1.0</small></h1><p>統計検定準1級への第一歩 · 動かす、理解する、確かめる。</p></header><main><nav id="nav"></nav><div><div class="mobile"><label for="menu" class="tag">学習テーマ</label><select id="menu"></select></div><article id="lesson"></article></div></main><footer>初版は準1級の全範囲を網羅していません。数値積分・表示範囲には近似があります。進捗はこのブラウザに保存されます。</footer><script>
'use strict';
const $=id=>document.getElementById(id),fmt=x=>typeof x==='number'?(Number.isFinite(x)?String(+x.toFixed(4)):'—'):x;
const range=(n,f)=>Array.from({length:n},(_,i)=>f(i)),fac=n=>{let v=1;for(let i=2;i<=n;i++)v*=i;return v},comb=(n,k)=>fac(n)/fac(k)/fac(n-k);
const normal=(x,m=0,s=1)=>Math.exp(-.5*((x-m)/s)**2)/(s*Math.sqrt(2*Math.PI));
function integ(f,a,b,n=800){if(b<=a)return 0;return range(n,i=>f(a+(i+.5)*(b-a)/n)).reduce((s,v)=>s+v,0)*(b-a)/n}
const Phi=z=>z<=-9?0:z>=9?1:Math.min(1,integ(normal,-9,z)); 
function lg(z){const p=[676.5203681218851,-1259.1392167224028,771.3234287776531,-176.6150291621406,12.507343278686905,-.13857109526572012,9.984369578019572e-6,1.5056327351493116e-7];if(z<.5)return Math.log(Math.PI)-Math.log(Math.sin(Math.PI*z))-lg(1-z);z-=1;let x=.9999999999998099;p.forEach((v,i)=>x+=v/(z+i+1));let t=z+7.5;return .5*Math.log(2*Math.PI)+(z+.5)*Math.log(t)-t+Math.log(x)}
const gamma=(x,a,t)=>x>0?Math.exp((a-1)*Math.log(x)-x/t-lg(a)-a*Math.log(t)):a===1?1/t:0;
const beta=(x,a,b)=>x>0&&x<1?Math.exp((a-1)*Math.log(x)+(b-1)*Math.log1p(-x)+lg(a+b)-lg(a)-lg(b)):x===0&&a===1?b:x===1&&b===1?a:0;
const student=(x,v)=>Math.exp(lg((v+1)/2)-lg(v/2)-.5*Math.log(v*Math.PI)-(v+1)/2*Math.log1p(x*x/v));
const F=(x,a,b)=>x>0?Math.exp(a/2*Math.log(a/b)+(a/2-1)*Math.log(x)-(a+b)/2*Math.log1p(a*x/b)+lg((a+b)/2)-lg(a/2)-lg(b/2)):x===0&&a===2?1:0;
const R=(id,label,min,max,step,val)=>({id,label,min,max,step,val});
function plot({a,b,ymin=0,ymax,curves=[],bars=[],points=[],shade,lines=[],xlabel='x',ylabel=''}){const L=56,T=22,w=560,h=224,X=x=>L+(x-a)/(b-a)*w,Y=y=>T+(ymax-y)/(ymax-ymin)*h;let out='<svg class="graph" viewBox="0 0 640 290" role="img" aria-label="操作結果のグラフ"><defs><clipPath id="clip"><rect x="56" y="22" width="560" height="224"/></clipPath></defs>';for(let i=0;i<=5;i++){let x=a+(b-a)*i/5,y=ymin+(ymax-ymin)*i/5;out+='<path class="grid" d="M '+X(x)+' '+T+' V '+(T+h)+' M '+L+' '+Y(y)+' H '+(L+w)+'"/><text x="'+X(x)+'" y="264" text-anchor="middle">'+fmt(x)+'</text><text x="49" y="'+(Y(y)+4)+'" text-anchor="end">'+fmt(y)+'</text>'}out+='<g clip-path="url(#clip)">';for(const sh of (Array.isArray(shade)?shade:shade?[shade]:[])){let lo=Math.max(a,sh.lo),hi=Math.min(b,sh.hi);if(hi>lo){let d='M '+X(lo)+' '+Y(0);for(let i=0;i<=150;i++){let x=lo+(hi-lo)*i/150;d+=' L '+X(x)+' '+Y(sh.f(x))}out+='<path d="'+d+' L '+X(hi)+' '+Y(0)+' Z" fill="#f7ae67" opacity=".55"/>'}}for(const bar of bars){let bw=(bar.width||.72)/(b-a)*w;out+='<rect x="'+(X(bar.x)-bw/2)+'" y="'+Y(Math.max(0,bar.y))+'" width="'+bw+'" height="'+Math.abs(Y(0)-Y(bar.y))+'" rx="2" fill="'+(bar.hit?'#16776e':'#d86c28')+'"/>'}curves.forEach((f,j)=>{let d='';for(let i=0;i<=300;i++){let x=a+(b-a)*i/300,y=f(x);if(Number.isFinite(y))d+=(d?' L ':'M ')+X(x)+' '+Y(y)}out+='<path class="'+(j?'other':'curve')+'" d="'+d+'"/>'});lines.forEach(l=>out+='<path class="other" d="M '+X(l[0])+' '+Y(l[1])+' L '+X(l[2])+' '+Y(l[3])+'"/>');points.forEach(p=>out+='<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="4" fill="#16776e"/>');return out+'</g><path class="axis" fill="none" d="M '+L+' '+T+' V '+(T+h)+' H '+(L+w)+'"/><text x="56" y="15">'+ylabel+'</text><text x="336" y="285" text-anchor="middle">'+xlabel+'</text></svg>'}
const res=(g,m,t)=>g+'<div class="metrics">'+m.map(([k,v])=>'<div class="metric"><small>'+k+'</small><strong>'+fmt(v)+'</strong></div>').join('')+'</div><p class="hint">'+t+'</p>';
function discrete(arr,k,m,t){return res(plot({a:-.5,b:arr.length-.5,ymax:Math.max(...arr)*1.15||1,bars:arr.map((y,x)=>({x,y,hit:x===k})),xlabel:'発生回数 k',ylabel:'確率'}),m,t)}
function density(f,a,b,c,m,t,other){let max=Math.max(...range(301,i=>Math.max(f(a+(b-a)*i/300),other?other(a+(b-a)*i/300):0)));return res(plot({a,b,ymax:max*1.15||1,curves:other?[f,other]:[f],shade:{lo:a,hi:c,f},xlabel:'値 x',ylabel:'確率密度'}),m,t)}
const L=[];function add(g,n,u,i,f,c,r,q,o,k,w){L.push({g,n,u,i,f,c,r,q,o,k,w})}
const A='01 数学の基礎',B='02 確率の基礎',C='03 離散型分布',D='04 連続型分布',E='05 推定・検定';
add(A,'Σ・平均・分散','データの中心とばらつきを要約する。','Σは足し合わせる指示。分散は平均からの距離を二乗して平均する。','平均 = Σxᵢ/n ｜ 分散 = Σ(xᵢ−平均)²/n',[R('v','最後の値',0,30,1,9)],({v})=>{let xs=[2,4,6,8,v],m=xs.reduce((a,b)=>a+b)/5,s=xs.reduce((a,b)=>a+(b-m)**2,0)/5;return res(plot({a:0,b:6,ymax:32,bars:xs.map((y,i)=>({x:i+1,y,hit:i===4})),lines:[[.5,m,5.5,m]],xlabel:'データ番号',ylabel:'値'}),[['合計',m*5],['平均',m],['分散',s]],'緑の棒を動かすと平均の破線と分散が変化します。ここでは分母 n を使用。')},'極端な外れ値があると分散は？',['一般に増える','必ず0になる','常に一定'],0,'平均との差を二乗するため外れ値の影響を受けます。');
add(A,'指数・対数','尤度の積を和に変換する。','対数は「底を何乗するとその値になるか」。','logₐ(aˣ)=x',[R('x','指数 x',-2,3,.1,1),R('a','底 a',1.2,3,.1,2)],({x,a})=>res(plot({a:-2,b:3,ymax:a**3*1.15,curves:[t=>a**t],points:[[x,a**x]],xlabel:'指数 x',ylabel:'aˣ'}),[['aˣ',a**x],['logₐ(aˣ)',x]],'底を大きくすると増加が急になります。'),'log₂8 は？',['2','3','4'],1,'2³=8です。');
add(A,'微分と接線','最尤推定で最大値を探す。','微分は曲線のその瞬間の傾き。緑の破線が接線。','f(x)=x² → f′(x)=2x',[R('x','接点 x',-3,3,.1,1)],({x})=>res(plot({a:-4,b:4,ymin:-7,ymax:17,curves:[t=>t*t,t=>2*x*(t-x)+x*x],points:[[x,x*x]],ylabel:'f(x)'}),[['関数の値',x*x],['接線の傾き',2*x]],'x=0では接線が水平になります。'),'x=2の微分値は？',['2','4','8'],1,'2x=4です。');
add(A,'積分と面積','連続型分布の確率を面積から求める。','細い長方形の面積を足すと曲線下の面積に近づく。','∫₀ᵇ x² dx = b³/3',[R('b','終点 b',.2,3,.1,2),R('n','分割数',2,50,1,8)],({b,n})=>{let d=b/n,bars=range(n,i=>({x:(i+.5)*d,y:(i*d)**2,width:d*.99}));return res(plot({a:0,b:3,ymax:10,bars,curves:[x=>x*x],ylabel:'x²'}),[['長方形の合計',bars.reduce((s,v)=>s+v.y*d,0)],['正確な積分値',b**3/3]],'分割数を増やすと近似値が正確な積分値に近づきます。')},'分割を細かくすると？',['面積の近似精度が上がる','面積が無限になる','面積が常に0'],0,'長方形と曲線の隙間が小さくなります。');
add(B,'条件付き確率・ベイズ','検査結果から病気である確率などを推定する。','陽性の中に真の陽性が何人いるかを考える。','P(A|B)=P(B|A)P(A)/P(B)',[R('p','有病率 %',1,50,1,5),R('s','感度 %',50,100,1,95),R('f','偽陽性率 %',1,40,1,5)],({p,s,f})=>{let a=p*s/100,b=(100-p)*f/100;return res(plot({a:-.7,b:1.7,ymax:100,bars:[{x:0,y:a,hit:true},{x:1,y:b}],xlabel:'0: 真陽性 / 1: 偽陽性',ylabel:'全体に占める %'}),[['真陽性 %',a],['偽陽性 %',b],['陽性時の有病率 %',100*a/(a+b)]],'有病率が低いと、高精度の検査でも偽陽性の割合が大きくなり得ます。')},'陽性時の有病率は感度と必ず同じ？',['同じ','違う'],1,'有病率と偽陽性率にも依存します。');
add(C,'二項分布','一定回数の独立試行で成功回数を求める。','コインをn回投げて表がk回出る確率。','P(X=k)= nCk pᵏ(1−p)ⁿ⁻ᵏ',[R('n','試行数 n',1,30,1,10),R('p','成功確率 p',.05,.95,.05,.5),R('k','成功回数 k',0,30,1,5)],({n,p,k})=>{let a=range(n+1,i=>comb(n,i)*p**i*(1-p)**(n-i));return discrete(a,k,[['P(X=k)',a[k]||0],['期待値',n*p],['分散',n*p*(1-p)]],k>n?'kがnを超えるため確率は0です。':'緑の棒が指定回数の確率です。')},'期待値は？',['np','p/n','n+p'],0,'n回の試行の期待値を足すとnpです。');
add(C,'ポアソン分布','一定時間のアクセス・故障・到着の件数をモデル化する。','平均λ回起きるイベントが、実際に何回起きるか。','P(X=k)=e⁻λ λᵏ/k!',[R('l','平均 λ',.5,15,.5,3),R('k','発生回数 k',0,40,1,3)],({l,k})=>{let a=range(41,i=>Math.exp(-l)*l**i/fac(i));return discrete(a,k,[['P(X=k)',a[k]],['期待値',l],['分散',l]],'λを増やすと中心が右に移り、広がりも増します。')},'ポアソン分布で等しいのは？',['期待値と分散','期待値と標準偏差','分散と最頻値'],0,'期待値も分散もλです。');
add(C,'幾何分布','最初の成功まで何回試行するかを考える。','初当たりまでの回数。ここでは成功試行を含め1回から数える。','P(X=k)=(1−p)ᵏ⁻¹p',[R('p','成功確率 p',.1,.9,.05,.3),R('k','回数 k',1,30,1,3)],({p,k})=>discrete([0,...range(30,i=>p*(1-p)**i)],k,[['P(X=k)',p*(1-p)**(k-1)],['期待値',1/p],['分散',(1-p)/p**2]],'pが小さいほど待ち時間が長くなります。'),'最初の成功が1回目の確率は？',['0','p','1−p'],1,'1回目で成功する確率pです。');
add(D,'正規分布','測定誤差や標本平均の分布に使う。','平均が中心、標準偏差が広がり。連続型では面積が確率。','X ～ N(μ, σ²)',[R('m','平均 μ',-3,3,.2,0),R('s','標準偏差 σ',.5,2.5,.1,1),R('c','境界 x',-6,6,.2,1)],({m,s,c})=>density(x=>normal(x,m,s),-12,12,c,[['P(X≤x)',Phi((c-m)/s)],['標準化 z',(c-m)/s],['分散',s*s]],'橙色の面積が境界以下の確率。グラフは−12〜12の表示です。'),'σを増やすと？',['山が広がる','平均が必ず増える','山が狭くなる'],0,'標準偏差は広がりを決めます。');
add(D,'指数分布','次のイベントまでの待ち時間をモデル化する。','ポアソン過程のイベント間隔に対応する。','f(x)=λe⁻λx (x≥0)',[R('l','発生率 λ',.3,3,.1,1),R('c','待ち時間 x',0,10,.2,2)],({l,c})=>density(x=>l*Math.exp(-l*x),0,15,c,[['P(X≤x)',1-Math.exp(-l*c)],['期待値',1/l],['分散',1/l**2]],'発生率が大きいほど待ち時間は短くなります。'),'λが2なら平均待ち時間は？',['2','0.5','4'],1,'期待値は1/λです。');
add(D,'ガンマ分布','複数イベントを待つ時間などを表す。','形状αと尺度θで山の位置や形が変わる。α=1で指数分布。','E[X]=αθ ｜ Var[X]=αθ²',[R('a','形状 α',1,8,.5,3),R('t','尺度 θ',.5,2,.1,1),R('c','境界 x',0,25,.5,4)],({a,t,c})=>{let f=x=>gamma(x,a,t);return density(f,0,30,c,[['P(X≤x) 約',integ(f,0,c)],['期待値',a*t],['分散',a*t*t]],'ここでは尺度パラメータθを使っています。')},'α=1のガンマ分布は？',['正規分布','指数分布','二項分布'],1,'率1/θの指数分布です。');
add(D,'ベータ分布','未知の割合・成功確率の不確かさを表す。','0〜1の値を取り、αとβで形が決まる。','E[X]=α/(α+β)',[R('a','α',1,12,1,2),R('b','β',1,12,1,5),R('c','境界 x',0,1,.01,.5)],({a,b,c})=>{let f=x=>beta(x,a,b);return density(f,0,1,c,[['P(X≤x) 約',integ(f,0,c)],['期待値',a/(a+b)],['分散',a*b/((a+b)**2*(a+b+1))]],'α=β=1で一様。αが大きいと平均は1に近づきます。')},'値の範囲は？',['0〜1','−∞〜∞','0〜∞'],0,'割合を扱える分布です。');
add(D,'カイ二乗分布','分散の推定・独立性の検定など。','独立な標準正規変数を二乗して足した値。','χ²(ν) = Z₁²+…+Zν²',[R('v','自由度 ν',2,20,1,5),R('c','境界 x',0,35,.5,8)],({v,c})=>{let f=x=>gamma(x,v/2,2);return density(f,0,45,c,[['P(X≤x) 約',integ(f,0,c)],['期待値',v],['分散',2*v]],'自由度が大きいと左右非対称性が弱くなります。')},'負の値を取る？',['取る','取らない'],1,'二乗の和なので非負です。');
add(D,'t分布','母分散が未知のとき母平均の推定・検定に使う。','標準正規分布より裾が厚い。自由度が増えると近づく。','T=Z/√(U/ν)',[R('v','自由度 ν',1,40,1,3),R('c','境界 x',-4,4,.1,2)],({v,c})=>{let f=x=>student(x,v);return density(f,-8,8,c,[['P(T≤x) 約',c>=0?.5+integ(f,0,c):.5-integ(f,c,0)],['自由度',v]],'緑の破線は標準正規分布。塗りつぶしは表示範囲内の面積です。',x=>normal(x))},'自由度が大きいと？',['標準正規分布に近づく','裾が無限に厚くなる'],0,'分母の変動が小さくなるためです。');
add(D,'F分布','分散比や分散分析に使う。','独立なカイ二乗変数を自由度で割った値の比。','F=(U/d₁)/(V/d₂)',[R('a','分子自由度',2,30,1,5),R('b','分母自由度',3,30,1,8),R('c','境界 x',0,6,.1,2)],({a,b,c})=>{let f=x=>F(x,a,b);return density(f,0,10,c,[['P(F≤x) 約',integ(f,0,c)],['期待値',b/(b-2)]],'正の値のみ取り、自由度で形が変わります。')},'F分布を使う代表例は？',['分散分析','文字列検索'],0,'分散に関連する比を利用します。');
add(E,'標本平均と標準誤差','標本から母平均を推定する精度を考える。','標本数nが増えると標本平均のばらつきが小さくなる。','SE=σ/√n',[R('s','母標準偏差 σ',1,5,.5,2),R('n','標本数 n',1,100,1,16)],({s,n})=>{let se=s/Math.sqrt(n);return density(x=>normal(x,0,se),-8,8,0,[['標準誤差',se],['標本平均の分散',se**2]],'橙色は母集団が正規分布の場合の標本平均の分布。緑の破線は母集団の分布です。',x=>normal(x,0,s))},'標本数を4倍にするとSEは？',['2倍','半分','4分の1'],1,'平方根で割るので半分です。');
add(E,'信頼区間','母平均の推定に不確かさを添える。','母標準偏差が既知の場合の正規近似・両側区間。','標本平均 ± z × σ/√n',[R('m','標本平均',-3,3,.1,1),R('s','母標準偏差',.5,4,.1,2),R('n','標本数',4,100,1,25)],({m,s,n})=>{let se=s/Math.sqrt(n),d=1.959964*se;return res(plot({a:-8,b:8,ymax:1,lines:[[m-d,.5,m+d,.5]],points:[[m-d,.5],[m,.5],[m+d,.5]],xlabel:'母平均の候補'}),[['95%下限',m-d],['95%上限',m+d],['区間幅',2*d]],'同じ手続きを繰り返すと約95%の区間が真の母平均を含みます。')},'標本数を増やすと区間幅は？',['狭くなる','広がる'],0,'標準誤差が小さくなるためです。');
add(E,'仮説検定とp値','観測結果が帰無仮説のもとでどれほど極端か調べる。','両側z検定。観測zの絶対値以上の両裾がp値。','p=2[1−Φ(|z|)]',[R('z','観測 z',-4,4,.1,1.8),R('a','有意水準 %',1,10,1,5)],({z,a})=>{let p=2*(1-Phi(Math.abs(z))),f=x=>normal(x);return res(plot({a:-5,b:5,ymax:.46,curves:[f],shade:[{lo:-5,hi:-Math.abs(z),f},{lo:Math.abs(z),hi:5,f}],lines:[[-Math.abs(z),0,-Math.abs(z),f(Math.abs(z))],[Math.abs(z),0,Math.abs(z),f(Math.abs(z))]],xlabel:'z',ylabel:'密度'}),[['両側 p値',p],['有意水準',a/100],['判定',p<a/100?'棄却':'棄却しない']],'橙色の左右の裾の面積を足した値が両側p値です。')},'p値が有意水準より小さいと？',['帰無仮説を棄却','帰無仮説が正しいと証明'],0,'帰無仮説を棄却します。');
let idx=0,done=[];try{done=JSON.parse(localStorage.getItem('stats-done-v1')||'[]');if(!Array.isArray(done))done=[];idx=Number(localStorage.getItem('stats-idx-v1'))||0}catch(e){}idx=Math.max(0,Math.min(L.length-1,Math.floor(idx)));
function save(){try{localStorage.setItem('stats-done-v1',JSON.stringify(done));localStorage.setItem('stats-idx-v1',String(idx))}catch(e){}}
function menu(){let h='<div class="tag">学習進捗 '+done.length+' / '+L.length+'</div><div class="progress"><span style="width:'+100*done.length/L.length+'%"></span></div>',last='';L.forEach((l,i)=>{if(l.g!==last){h+='<h3>'+l.g+'</h3>';last=l.g}h+='<button data-i="'+i+'" class="'+(i===idx?'active':'')+'">'+(done.includes(i)?'✓ ':'')+l.n+'</button>'});$('nav').innerHTML=h;$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));$('menu').innerHTML=L.map((l,i)=>'<option value="'+i+'">'+(done.includes(i)?'✓ ':'')+l.g+' / '+l.n+'</option>').join('');$('menu').value=idx}
function go(i){idx=i;save();show();window.scrollTo(0,0)}
function show(){menu();let l=L[idx];$('lesson').innerHTML='<div class="tag">'+l.g+' · '+(idx+1)+' / '+L.length+' · 学習済 '+done.length+'</div><h2>'+l.n+'</h2><h3>何のために使う？</h3><p>'+l.u+'</p><h3>まずはイメージ</h3><p>'+l.i+'</p><div class="formula">'+l.f+'</div><div class="panel"><div class="tag">実験室 · スライダーを動かしてみよう</div><div class="controls">'+l.c.map(c=>'<div class="control"><label for="r-'+c.id+'">'+c.label+' <output id="o-'+c.id+'">'+c.val+'</output></label><input type="range" id="r-'+c.id+'" min="'+c.min+'" max="'+c.max+'" step="'+c.step+'" value="'+c.val+'"></div>').join('')+'</div><div id="viz"></div><button id="reset">初期値に戻す</button></div><div class="quiz"><h3>理解度チェック</h3><p>'+l.q+'</p>'+l.o.map((o,i)=>'<button data-q="'+i+'">'+o+'</button>').join('')+'<p id="feedback" aria-live="polite"></p></div><div class="foot"><button id="prev" '+(idx===0?'disabled':'')+'>← 前へ</button><button class="primary" id="mark">'+(done.includes(idx)?'学習済 ✓':'学習済にする')+'</button><button id="next" '+(idx===L.length-1?'disabled':'')+'>次へ →</button></div>';function draw(){let v={};l.c.forEach(c=>{v[c.id]=Number($('r-'+c.id).value);$('o-'+c.id).textContent=fmt(v[c.id])});$('viz').innerHTML=l.r(v)}l.c.forEach(c=>$('r-'+c.id).oninput=draw);$('reset').onclick=()=>{l.c.forEach(c=>$('r-'+c.id).value=c.val);draw()};$('lesson').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{let correct=+b.dataset.q===l.k;$('lesson').querySelectorAll('[data-q]').forEach(x=>x.className='');b.className=correct?'good':'bad';$('feedback').textContent=(correct?'正解！ ':'もう一度考えてみよう。 ')+l.w});$('prev').onclick=()=>go(idx-1);$('next').onclick=()=>go(idx+1);$('mark').onclick=()=>{done=done.includes(idx)?done.filter(x=>x!==idx):[...done,idx];save();menu();$('mark').textContent=done.includes(idx)?'学習済 ✓':'学習済にする';$('lesson').querySelector('.tag').textContent=l.g+' · '+(idx+1)+' / '+L.length+' · 学習済 '+done.length};draw()}
$('menu').onchange=e=>go(+e.target.value);show();
</script></body></html>
