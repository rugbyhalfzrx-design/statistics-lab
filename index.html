add(A,'Σ・平均・分散','データの中心とばらつきを要約する。','Σは足し合わせる指示。分散は平均からの距離を二乗して平均する。','平均 = Σxᵢ/n ｜ 分散 = Σ(xᵢ−平均)²/n',[R('v','最後の値',0,30,1,9)],({v})=>{let xs=[2,4,6,8,v],m=xs.reduce((a,b)=>a+b)/5,s=xs.reduce((a,b)=>a+(b-m)**2,0)/5;return res(plot({a:0,b:6,ymax:32,bars:xs.map((y,i)=>({x:i+1,y,hit:i===4})),lines:[[.5,m,5.5,m]],xlabel:'データ番号',ylabel:'値'}),[['合計',m*5],['平均',m],['分散',s]],'緑の棒を動かすと平均の破線と分散が変化します。ここでは分母 n を使用。')},'極端な外れ値があると分散は？',['一般に増える','必ず0になる','常に一定'],0,'平均との差を二乗するため外れ値の影響を受けます。');
add(A,'指数・対数','尤度の積を和に変換する。','対数は「底を何乗するとその値になるか」。','logₐ(aˣ)=x',[R('x','指数 x',-2,3,.1,1),R('a','底 a',1.2,3,.1,2)],({x,a})=>res(plot({a:-2,b:3,ymax:a**3*1.15,curves:[t=>a**t],points:[[x,a**x]],xlabel:'指数 x',ylabel:'aˣ'}),[['aˣ',a**x],['logₐ(aˣ)',x]],'底を大きくすると増加が急になります。'),'log₂8 は？',['2','3','4'],1,'2³=8です。');
add(A,'微分と接線','最尤推定で最大値を探す。','微分は曲線のその瞬間の傾き。緑の破線が接線。','f(x)=x² → f′(x)=2x',[R('x','接点 x',-3,3,.1,1)],({x})=>res(plot({a:-4,b:4,ymin:-7,ymax:17,curves:[t=>t*t,t=>2*x*(t-x)+x*x],points:[[x,x*x]],ylabel:'f(x)'}),[['関数の値',x*x],['接線の傾き',2*x]],'x=0では接線が水平になります。'),'x=2の微分値は？',['2','4','8'],1,'2x=4です。');
add(A,'積分と面積','連続型分布の確率を面積から求める。','細い長方形の面積を足すと曲線下の面積に近づく。','∫₀ᵇ x² dx = b³/3',[R('b','終点 b',.2,3,.1,2),R('n','分割数',2,50,1,8)],({b,n})=>{let d=b/n,bars=range(n,i=>({x:(i+.5)*d,y:(i*d)**2,width:d*.99}));return res(plot({a:0,b:3,ymax:10,bars,curves:[x=>x*x],ylabel:'x²'}),[['長方形の合計',bars.reduce((s,v)=>s+v.y*d,0)],['正確な積分値',b**3/3]],'分割数を増やすと近似値が正確な積分値に近づきます。')},'分割を細かくすると？',['面積の近似精度が上がる','面積が無限になる','面積が常に0'],0,'長方形と曲線の隙間が小さくなります。');
add(B,'条件付き確率・ベイズ','検査結果から病気である確率などを推定する。','陽性の中に真の陽性が何人いるかを考える。','P(A|B)=P(B|A)P(A)/P(B)',[R('p','有病率 %',1,50,1,5),R('s','感度 %',50,100,1,95),R('f','偽陽性率 %',1,40,1,5)],({p,s,f})=>{let a=p*s/100,b=(100-p)*f/100;return res(plot({a:-.7,b:1.7,ymax:100,bars:[{x:0,y:a,hit:true},{x:1,y:b}],xlabel:'0: 真陽性 / 1: 偽陽性',ylabel:'全体に占める %'}),[['真陽性 %',a],['偽陽性 %',b],['陽性時の有病率 %',100*a/(a+b)]],'有病率が低いと、高精度の検査でも偽陽性の割合が大きくなり得ます。')},'陽性時の有病率は感度と必ず同じ？',['同じ','違う'],1,'有病率と偽陽性率にも依存します。');
add(C,'二項分布','一定回数の独立試行で成功回数を求める。','コインをn回投げて表がk回出る確率。','P(X=k)= nCk pᵏ(1−p)ⁿ⁻ᵏ',[R('n','試行数 n',1,30,1,10),R('p','成功確率 p',.05,.95,.05,.5),R('k','成功回数 k',0,30,1,5)],({n,p,k})=>{let a=range(n+1,i=>comb(n,i)*p**i*(1-p)**(n-i));return discrete(a,k,[['P(X=k)',a[k]||0],['期待値',n*p],['分散',n*p*(1-p)]],k>n?'kがnを超えるため確率は0です。':'緑の棒が指定回数の確率です。')},'期待値は？',['np','p/n','n+p'],0,'n回の試行の期待値を足すとnpです。');
add(C,'ポアソン分布','一定時間のアクセス・故障・到着の件数をモデル化する。','平均λ回起きるイベントが、実際に何回起きるか。','P(X=k)=e⁻λ λᵏ/k!',[R('l','平均 λ',.5,15,.5,3),R('k','発生回数 k',0,40,1,3)],({l,k})=>{let a=range(41,i=>Math.exp(-l)*l**i/fac(i));return discrete(a,k,[['P(X=k)',a[k]],['期待値',l],['分散',l]],'λを増やすと中心が右に移り、広がりも増します。')},'ポアソン分布で等しいのは？',['期待値と分散','期待値と標準偏差','分散と最頻値'],0,'期待値も分散もλです。');
add(C,'幾何分布','最初の成功まで何回試行するかを考える。','初当たりまでの回数。ここでは成功試行を含め1回から数える。','P(X=k)=(1−p)ᵏ⁻¹p',[R('p','成功確率 p',.1,.9,.05,.3),R('k','回数 k',1,30,1,3)],({p,k})=>discrete([0,...range(30,i=>p*(1-p)**i)],k,[['P(X=k)',p*(1-p)**(k-1)],['期待値',1/p],['分散',(1-p)/p**2]],'pが小さいほど待ち時間が長くなります。'),'最初の成功が1回目の確率は？',['0','p','1−p'],1,'1回目で成功する確率pです。');
add(D,'正規分布','測定誤差や標本平均の分布に使う。','平均が中心、標準偏差が広がり。連続型では面積が確率。','X ～ N(μ, σ²)',[R('m','平均 μ (cm)',155,185,1,170),R('s','標準偏差 σ (cm)',5,12,1,5),R('c','境界 x (cm)',130,210,1,175)],({m,s,c,mode})=>{let f=x=>normal(x,m,s),central=mode!=='cdf',lo=central?m-s:130,hi=central?m+s:c;return res(plot({a:130,b:210,ymax:.09,curves:[f],shade:{lo,hi,f},markers:[{x:m,label:'μ = '+m}],xtickValues:[130,150,170,190,210],xlabel:'身長 (cm)',ylabel:'確率密度'}),[['平均 (cm)',m],['標準偏差 (cm)',s],['分散 (cm²)',s*s],[central?'平均±1σの確率 (%)':'境界以下の確率 (%)',central?68.2689:100*Phi((c-m)/s)]],central?'塗りつぶしは平均±1標準偏差。正規分布なら約68.3%です。境界のスライダーは「境界以下」に切り替えると有効になります。':'塗りつぶしは指定した身長以下の確率。表示範囲外の裾も計算に含みます。')},'σを増やすと？',['山が広がる','平均が必ず増える','山が狭くなる'],0,'標準偏差は広がりを決めます。N（平均, 分散）なので第2引数はσ²です。');
add(D,'指数分布','次のイベントまでの待ち時間をモデル化する。','ポアソン過程のイベント間隔に対応する。','f(x)=λe⁻λx (x≥0)',[R('l','発生率 λ',.3,3,.1,1),R('c','待ち時間 x',0,10,.2,2)],({l,c})=>density(x=>l*Math.exp(-l*x),0,15,c,[['P(X≤x)',1-Math.exp(-l*c)],['期待値',1/l],['分散',1/l**2]],'発生率が大きいほど待ち時間は短くなります。'),'λが2なら平均待ち時間は？',['2','0.5','4'],1,'期待値は1/λです。');
add(D,'ガンマ分布','複数イベントを待つ時間などを表す。','形状αと尺度θで山の位置や形が変わる。α=1で指数分布。','E[X]=αθ ｜ Var[X]=αθ²',[R('a','形状 α',1,8,.5,3),R('t','尺度 θ',.5,2,.1,1),R('c','境界 x',0,25,.5,4)],({a,t,c})=>{let f=x=>gamma(x,a,t);return density(f,0,30,c,[['P(X≤x) 約',integ(f,0,c)],['期待値',a*t],['分散',a*t*t]],'ここでは尺度パラメータθを使っています。')},'α=1のガンマ分布は？',['正規分布','指数分布','二項分布'],1,'率1/θの指数分布です。');
add(D,'ベータ分布','未知の割合・成功確率の不確かさを表す。','0〜1の値を取り、αとβで形が決まる。','E[X]=α/(α+β)',[R('a','α',1,12,1,2),R('b','β',1,12,1,5),R('c','境界 x',0,1,.01,.5)],({a,b,c})=>{let f=x=>beta(x,a,b);return density(f,0,1,c,[['P(X≤x) 約',integ(f,0,c)],['期待値',a/(a+b)],['分散',a*b/((a+b)**2*(a+b+1))]],'α=β=1で一様。αが大きいと平均は1に近づきます。')},'値の範囲は？',['0〜1','−∞〜∞','0〜∞'],0,'割合を扱える分布です。');
add(D,'カイ二乗分布','分散の推定・独立性の検定など。','独立な標準正規変数を二乗して足した値。','χ²(ν) = Z₁²+…+Zν²',[R('v','自由度 ν',2,20,1,5),R('c','境界 x',0,35,.5,8)],({v,c})=>{let f=x=>gamma(x,v/2,2);return density(f,0,45,c,[['P(X≤x) 約',integ(f,0,c)],['期待値',v],['分散',2*v]],'自由度が大きいと左右非対称性が弱くなります。')},'負の値を取る？',['取る','取らない'],1,'二乗の和なので非負です。');
add(D,'t分布','母分散が未知のとき母平均の推定・検定に使う。','標準正規分布より裾が厚い。自由度が増えると近づく。','T=Z/√(U/ν)',[R('v','自由度 ν',1,40,1,3),R('c','境界 x',-4,4,.1,2)],({v,c})=>{let f=x=>student(x,v);return density(f,-8,8,c,[['P(T≤x) 約',c>=0?.5+integ(f,0,c):.5-integ(f,c,0)],['自由度',v]],'緑の破線は標準正規分布。塗りつぶしは表示範囲内の面積です。',x=>normal(x))},'自由度が大きいと？',['標準正規分布に近づく','裾が無限に厚くなる'],0,'分母の変動が小さくなるためです。');
add(D,'F分布','分散比や分散分析に使う。','独立なカイ二乗変数を自由度で割った値の比。','F=(U/d₁)/(V/d₂)',[R('a','分子自由度',2,30,1,5),R('b','分母自由度',3,30,1,8),R('c','境界 x',0,6,.1,2)],({a,b,c})=>{let f=x=>F(x,a,b);return density(f,0,10,c,[['P(F≤x) 約',integ(f,0,c)],['期待値',b/(b-2)]],'正の値のみ取り、自由度で形が変わります。')},'F分布を使う代表例は？',['分散分析','文字列検索'],0,'分散に関連する比を利用します。');
add(E,'標本平均と標準誤差','標本から母平均を推定する精度を考える。','標本数nが増えると標本平均のばらつきが小さくなる。','SE=σ/√n',[R('s','母標準偏差 σ',1,5,.5,2),R('n','標本数 n',1,100,1,16)],({s,n})=>{let se=s/Math.sqrt(n);return density(x=>normal(x,0,se),-8,8,0,[['標準誤差',se],['標本平均の分散',se**2]],'橙色は母集団が正規分布の場合の標本平均の分布。緑の破線は母集団の分布です。',x=>normal(x,0,s))},'標本数を4倍にするとSEは？',['2倍','半分','4分の1'],1,'平方根で割るので半分です。');
add(E,'信頼区間','母平均の推定に不確かさを添える。','母標準偏差が既知の場合の正規近似・両側区間。','標本平均 ± z × σ/√n',[R('m','標本平均',-3,3,.1,1),R('s','母標準偏差',.5,4,.1,2),R('n','標本数',4,100,1,25)],({m,s,n})=>{let se=s/Math.sqrt(n),d=1.959964*se;return res(plot({a:-8,b:8,ymax:1,lines:[[m-d,.5,m+d,.5]],points:[[m-d,.5],[m,.5],[m+d,.5]],xlabel:'母平均の候補'}),[['95%下限',m-d],['95%上限',m+d],['区間幅',2*d]],'同じ手続きを繰り返すと約95%の区間が真の母平均を含みます。')},'標本数を増やすと区間幅は？',['狭くなる','広がる'],0,'標準誤差が小さくなるためです。');
add(E,'仮説検定とp値','観測結果が帰無仮説のもとでどれほど極端か調べる。','両側z検定。観測zの絶対値以上の両裾がp値。','p=2[1−Φ(|z|)]',[R('z','観測 z',-4,4,.1,1.8),R('a','有意水準 %',1,10,1,5)],({z,a})=>{let p=2*(1-Phi(Math.abs(z))),f=x=>normal(x);return res(plot({a:-5,b:5,ymax:.46,curves:[f],shade:[{lo:-5,hi:-Math.abs(z),f},{lo:Math.abs(z),hi:5,f}],lines:[[-Math.abs(z),0,-Math.abs(z),f(Math.abs(z))],[Math.abs(z),0,Math.abs(z),f(Math.abs(z))]],xlabel:'z',ylabel:'密度'}),[['両側 p値',p],['有意水準',a/100],['判定',p<a/100?'棄却':'棄却しない']],'橙色の左右の裾の面積を足した値が両側p値です。')},'p値が有意水準より小さいと？',['帰無仮説を棄却','帰無仮説が正しいと証明'],0,'帰無仮説を棄却します。');
const mathCards=["<div class=\"math-heading\">基本の数式</div><div class=\"math-line\"><div class=\"math-label\">平均</div><div class=\"math-scroll\"><div class=\"eq-display\"><div class=\"eq-layout\"><span class=\"eq-overbar\"><span class=\"eq-mi\">x</span></span><span class=\"eq-op\">=</span><span class=\"eq-frac\"><span class=\"eq-top\"><span class=\"eq-row\"><span class=\"eq-limits\"><span class=\"eq-upper\"><span class=\"eq-mi\">n</span></span><span class=\"eq-big\"><span class=\"eq-op\">∑</span></span><span class=\"eq-lower\"><span class=\"eq-row\"><span class=\"eq-mi\">i</span><span class=\"eq-op\">=</span><span class=\"eq-num\">1</span></span></span></span><span class=\"eq-power\"><span class=\"eq-mi\">x</span><sub><span class=\"eq-mi\">i</span></sub></span></span></span><span class=\"eq-bottom\"><span class=\"eq-mi\">n</span></span></span></div></div></div></div><div class=\"math-line\"><div class=\"math-label\">分散（分母 n）</div><div class=\"math-scroll\"><div class=\"eq-display\"><div class=\"eq-layout\"><span class=\"eq-row\"><span class=\"eq-mi eq-upright\">Var</span><span class=\"eq-op\">[</span><span class=\"eq-mi\">X</span><span class=\"eq-op\">]</span></span><span class=\"eq-op\">=</span><span class=\"eq-frac\"><span class=\"eq-top\"><span class=\"eq-row\"><span class=\"eq-limits\"><span class=\"eq-upper\"><span class=\"eq-mi\">n</span></span><span class=\"eq-big\"><span class=\"eq-op\">∑</span></span><span class=\"eq-lower\"><span class=\"eq-row\"><span class=\"eq-mi\">i</span><span class=\"eq-op\">=</span><span class=\"eq-num\">1</span></span></span></span><span class=\"eq-power\"><span class=\"eq-row\"><span class=\"eq-op\">(</span><span class=\"eq-power\"><span class=\"eq-mi\">x</span><sub><span class=\"eq-mi\">i</span></sub></span><span class=\"eq-op\">−</span><span class=\"eq-overbar\"><span class=\"eq-mi\">x</span></span><span class=\"eq-op\">)</span></span><sup><span class=\"eq-num\">2</span></sup></span></span></span><span class=\"eq-bottom\"><span cl details class=\"math-details\" open><summary>記号の意味</summary><dl><div><dt>Z</dt><dd>標準正規分布に従う変数</dd></div><div><dt>U</dt><dd>自由度νのカイ二乗分布に従う変数（Z と独立）</dd></div><div><dt>ν</dt><dd>自由度</dd></div></dl></details>","<div class=\"math-heading\">基本の数式</div><div class=\"math-line\"><div class=\"math-label\">F分布の作り方</div><div class=\"math-scroll\"><div class=\"eq-display\"><div class=\"eq-layout\"><span class=\"eq-mi\">F</span><span class=\"eq-op\">=</span><span class=\"eq-frac\"><span class=\"eq-top\"><span class=\"eq-frac\"><span class=\"eq-top\"><span class=\"eq-mi\">U</span></span><span class=\"eq-bottom\"><span class=\"eq-power\"><span class=\"eq-mi\">d</span><sub><span class=\"eq-num\">1</span></sub></span></span></span></span><span class=\"eq-bottom\"><span class=\"eq-frac\"><span class=\"eq-top\"><span class=\"eq-mi\">V</span></span><span class=\"eq-bottom\"><span class=\"eq-power\"><span class=\"eq-mi\">d</span><sub><span class=\"eq-num\">2</span></sub></span></span></span></span></span></div></div></div></div><details class=\"math-details\" open><summary>記号の意味</summary><dl><div><dt>U, V</dt><dd>互いに独立なカイ二乗分布に従う変数</dd></div><div><dt>d₁, d₂</dt><dd>それぞれの自由度</dd></div></dl></details>","<div class=\"math-heading\">基本の数式</div><div class=\"math-line\"><div class=\"math-label\">標準誤差</div><div class=\"math-scroll\"><div class=\"eq-display\"><div class=\"eq-layout\"><span class=\"eq-mi eq-upright\">SE</span><span class=\"eq-op\">=</span><span class=\"eq-frac\"><span class=\"eq-top\"><span class=\"eq-mi\">σ</span></span><span class=\"eq-bottom\"><span class=\"eq-root\"><span class=\"eq-radical\">√</span><span class=\"eq-radicand\"><span class=\"eq-mi\">n</span></span></span></span></span></div></div></div></div><details class=\"math-details\" open><summary>記号の意味</summary><dl><div><dt>SE</dt><dd>標本平均の標準偏差（標準誤差）</dd></div><div><dt>σ</dt><dd>母集団の標準偏差</dd></div><div><dt>n</dt><dd>標本数</dd></div></dl></details>","<div class=\"math-heading\">基本の数式</div><div class=\"math-line\"><div class=\"math-label\">95%信頼区間（母標準偏差が既知）</div><div class=\"math-scroll\"><div class=\"eq-display\"><div class=\"eq-layout\"><span class=\"eq-overbar\"><span class=\"eq-mi\">x</span></span><span class=\"eq-op\">±</span><span class=\"eq-num\">1.96</span><span class=\"eq-op\">×</span><span class=\"eq-frac\"><span class=\"eq-top\"><span class=\"eq-mi\">σ</span></span><span class=\"eq-bottom\"><span class=\"eq-root\"><span class=\"eq-radical\">√</span><span class=\"eq-radicand\"><span class=\"eq-mi\">n</span></span></span></span></span></div></div></div></div><details class=\"math-details\" open><summary>記号の意味</summary><dl><div><dt>x̄</dt><dd>標本平均</dd></div><div><dt>1.96</dt><dd>標準正規分布の両側95%に対応する値</dd></div><div><dt>σ</dt><dd>母集団の標準偏差</dd></div><div><dt>n</dt><dd>標本数</dd></div></dl></details>","<div class=\"math-heading\">基本の数式</div><div class=\"math-line\"><div class=\"math-label\">両側検定の p 値</div><div class=\"math-scroll\"><div class=\"eq-display\"><div class=\"eq-layout\"><span class=\"eq-mi\">p</span><span class=\"eq-op\">=</span><span class=\"eq-num\">2</span><span class=\"eq-op\">[</span><span class=\"eq-num\">1</span><span class=\"eq-op\">−</span><span class=\"eq-mi\">Φ</span><span class=\"eq-row\"><span class=\"eq-op\">(</span><span class=\"eq-op\">|</span><span class=\"eq-mi\">z</span><span class=\"eq-op\">|</span><span class=\"eq-op\">)</span></span><span class=\"eq-op\">]</span></div></div></div></div><details class=\"math-details\" open><summary>記号の意味</summary><dl><div><dt>z</dt><dd>観測された z 統計量</dd></div><div><dt>|z|</dt><dd>z の絶対値</dd></div><div><dt>Φ</dt><dd>ファイ：標準正規分布の累積分布関数</dd></div><div><dt>p</dt><dd>帰無仮説の下で観測値と同程度以上に極端な値が出る確率</dd></div></dl></details>"];
const examples=[["5人の小テスト","2、4、6、8、9点の5人。最後の人の点数だけ変えると、平均や分散はどう変わる？","最後の点を6→30点に変更。平均の変化より分散の増え方に注目。","緑の棒：変更した点数｜緑の破線：平均"],["データが2倍ずつ増える","1件のデータが毎日2倍になると、3日後に8件。対数は逆に「8件になるまで何日か」を求める。","底を2、指数を3に設定すると8。底を3にすると27になる。","橙の線：指数関数｜緑の点：選んだ値"],["車の移動距離と速度","走り始めてから t 秒後の距離を t² m と仮定する。微分するとその瞬間の速度 2t m/s が分かる。負のxは数学的な拡張。","接点を1→2に変更。距離は1→4 m、接線の傾きは2→4 m/s。","橙の線：距離｜緑の破線：接線"],["速度から移動距離へ","速度が t² m/s のとき、0秒から2秒までの移動距離は速度グラフの下の面積になる。","終点2、分割数2→50。長方形の合計が8/3 mに近づく。","橙の曲線：速度｜棒：小さな面積"],["1,000人の検査（架空の設定）","有病率5%、感度95%、偽陽性率5%。病気の50人と病気でない950人の両方から陽性が出る。陽性＝病気とは限らない。","有病率を5→1%に下げ、陽性者のうち本当に病気の人の割合を確認。","緑：真陽性｜橙：偽陽性"],["コインを10回投げる","公平なコインを10回投げ、表がちょうど5回出る確率を考える。各試行は独立、成功確率は0.5と仮定。","n=10、p=0.5でkを0、5、10に変更。p=0.8なら山が右へ動く。","緑の棒：指定回数｜橙の棒：その他の回数"],["1分間に来るWebアクセス","平均3件/分のアクセスが独立に一定の率で発生すると仮定。次の1分間にちょうど3件来る確率は？","λを3→8にすると中心が右へ移動。kを変えると緑の棒が移動。","緑の棒：指定回数｜橙の棒：その他の回数"],["当たりを引くまでガチャを回す","毎回独立に30%の確率で当たりが出ると仮定。初めて当たるのが3回目である確率は？","pを0.3→0.1に変更。平均回数が約3.33→10回になる。","緑の棒：指定回数｜橙の棒：その他の回数"],["ある集団の身長（仮想データ）","平均170 cm、標準偏差5 cmの正規分布を仮定。平均付近に人が多く、離れるほど少なくなる。Xは身長、Nは正規分布、μは平均、σ²は分散。","平均170→175で山の位置、標準偏差5→10で山の広がりを確認。面積の種類も切り替えよう。","橙の線：身長の確率密度｜淡い橙：選択範囲の確率｜緑の破線：平均"],["次のアクセスまで何分待つ？","一定の率で独立にアクセスが発生するポアソン過程を仮定。平均1件/分なら次のアクセスまでの平均待ち時間は1分。","λを1→2にすると平均待ち時間は1→0.5分。","橙の線：待ち時間の密度｜淡い橙：境界以下"],["3件目のアクセスを待つ","平均1件/分のポアソン過程で3件目のアクセスが来るまでの時間。形状3、尺度1分なら平均3分。整数の形状はイベント数に対応する。","αを1→3→5に変更。必要なアクセス数が増えると平均待ち時間が長くなる。","橙の線：待ち時間の密度｜淡い橙：境界以下"],["未知のクリック率を推測する","一様な事前分布から1回クリック、4回非クリックを独立に観測すると、未知のクリック率の事後分布はベータ分布(2,5)になる。","αを増やすと高い成功率へ、βを増やすと低い成功率へ分布が移る。","橙の線：成功率の密度｜淡い橙：境界以下"],["測定誤差を二乗する","5個の独立な標準正規誤差を二乗して足す。負の誤差も正になり、合計は0以上。自由度5のカイ二乗分布になる。","自由度5→15。平均は増え、分布の歪みは相対的に小さくなる。","橙の線：二乗和の密度｜淡い橙：境界以下"],["少人数で平均を推定する","正規母集団から4人のデータを集め、母分散が不明なまま平均を推定すると自由度3のt統計量を使う。","自由度3→30。標準正規分布との裾の違いが小さくなる。","橙の線：t分布｜緑の破線：標準正規分布｜淡い橙：境界以下"],["2台の機械のばらつきを比べる","独立な正規標本で母分散が等しいと仮定すると、2つの不偏分散の比はF分布に従う。標本サイズ6と9なら自由度5と8。","2つの自由度を増やして分散比が1付近に集まる様子を確認。","橙の線：分散比の密度｜淡い橙：境界以下"],["測定値を何回平均すれば安定する？","母標準偏差2の測定値を独立に16回測って平均する。1回の測定より平均のばらつきが小さい。","標本数1→16→64。標準誤差が2→0.5→0.25になる。","橙の線：標本平均｜緑の破線：母集団"],["平均の誤差を範囲で伝える","母標準偏差2の正規母集団から25件を独立に測り、標本平均が1だったとする。母平均の95%信頼区間を作る。","標本数25→100。区間の幅が半分になる。","緑の線：95%信頼区間｜中央の点：標本平均"],["改善前後で処理時間は変わった？","帰無仮説は「平均処理時間に差がない」。既知の標準誤差で標準化した観測z=1.8を例に、両側検定で偶然では説明しにくいか調べる。","zを1.8→2.5へ。有意水準5%でp値が小さくなり、判定が変わる。","橙の線：帰無仮説の分布｜淡い橙：両側p値の面積"]];
const readings=[v=>{let a=[2,4,6,8,v.v],m=a.reduce((s,x)=>s+x,0)/5;return '平均 '+fmt(m)+' 点、分散 '+fmt(a.reduce((s,x)=>s+(x-m)**2,0)/5)+'。変更した点数が平均から離れると分散は大きくなります。'},
v=>'底 '+fmt(v.a)+'、指数 '+fmt(v.x)+' なら '+fmt(v.a**v.x)+'。対数を使うと元の指数 '+fmt(v.x)+' が分かります。',
v=>'x='+fmt(v.x)+' のとき、関数の値は '+fmt(v.x*v.x)+'、接線の傾きは '+fmt(2*v.x)+'。傾きが正なら右上がり、負なら右下がりです。',
v=>'0 から '+fmt(v.b)+' までの正確な面積は '+fmt(v.b**3/3)+'。分割数 '+v.n+' の長方形の合計と比較しましょう。',
v=>{let t=10*v.p*v.s/100,g=10*(100-v.p)*v.f/100;return '1,000人あたりの期待人数：真陽性 '+fmt(t)+' 人、偽陽性 '+fmt(g)+' 人。陽性者の約 '+fmt(100*t/(t+g))+'% が病気です。'},
v=>'成功確率 '+fmt(v.p*100)+'% の試行を '+v.n+' 回行い、ちょうど '+v.k+' 回成功する確率は '+fmt(100*(v.k>v.n?0:comb(v.n,v.k)*v.p**v.k*(1-v.p)**(v.n-v.k)))+'%。',
v=>'平均 '+fmt(v.l)+' 件/分のとき、次の1分にちょうど '+v.k+' 件来る確率は '+fmt(100*Math.exp(-v.l)*v.l**v.k/fac(v.k))+'%。',
v=>'当たり確率 '+fmt(v.p*100)+'% のとき、初当たりが '+v.k+' 回目となる確率は '+fmt(100*v.p*(1-v.p)**(v.k-1))+'%。平均 '+fmt(1/v.p)+' 回で当たります。',
v=>'X ∼ N('+fmt(v.m)+', '+fmt(v.s*v.s)+')。平均±標準偏差（'+fmt(v.m-v.s)+'〜'+fmt(v.m+v.s)+' cm）には約68.3%が入ります。'+fmt(v.c)+' cm以下は約 '+fmt(100*Phi((v.c-v.m)/v.s))+'%。',
v=>'平均 '+fmt(v.l)+' 件/分なら平均待ち時間 '+fmt(1/v.l)+' 分。'+fmt(v.c)+' 分以内に次のアクセスが来る確率は '+fmt(100*(1-Math.exp(-v.l*v.c)))+'%。',
v=>'形状 '+fmt(v.a)+'、尺度 '+fmt(v.t)+' 分なら平均 '+fmt(v.a*v.t)+' 分。'+fmt(v.c)+' 分以内の確率は約 '+fmt(100*integ(x=>gamma(x,v.a,v.t),0,v.c))+'%。',
v=>'α='+v.a+'、β='+v.b+' なら未知の成功率の平均は '+fmt(100*v.a/(v.a+v.b))+'%。成功率が '+fmt(v.c*100)+'% 以下の事後確率は約 '+fmt(100*integ(x=>beta(x,v.a,v.b),0,v.c))+'%。',
v=>'独立な標準正規変数 '+v.v+' 個の二乗和。平均 '+v.v+'、分散 '+2*v.v+'。'+fmt(v.c)+' 以下の確率は約 '+fmt(100*integ(x=>gamma(x,v.v/2,2),0,v.c))+'%。',
v=>'正規母集団の1標本t検定で標本数 '+(v.v+1)+' なら自由度 '+v.v+'。自由度が増えるほど標準正規分布に近づきます。',
v=>'標本サイズ '+(v.a+1)+' と '+(v.b+1)+' の例。分散比が '+fmt(v.c)+' 以下となる確率は約 '+fmt(100*integ(x=>F(x,v.a,v.b),0,v.c))+'%。',
v=>'母標準偏差 '+fmt(v.s)+' のデータを '+v.n+' 回平均すると、標準誤差は '+fmt(v.s/Math.sqrt(v.n))+'。1回の測定のばらつきと比べましょう。',
v=>{let d=1.959964*v.s/Math.sqrt(v.n);return '標本平均 '+fmt(v.m)+'、標本数 '+v.n+' なら95%信頼区間は '+fmt(v.m-d)+' 〜 '+fmt(v.m+d)+'。区間幅は '+fmt(2*d)+'。'},
v=>{let p=2*(1-Phi(Math.abs(v.z)));return '観測z='+fmt(v.z)+'、p値は約 '+fmt(p*100)+'%。有意水準 '+v.a+'% では帰無仮説を'+(p<v.a/100?'棄却する':'棄却しない')+'。'}];
let idx=0,done=[];try{done=JSON.parse(localStorage.getItem('stats-done-v1')||'[]');if(!Array.isArray(done))done=[];idx=Number(localStorage.getItem('stats-idx-v1'))||0}catch(e){}idx=Math.max(0,Math.min(L.length-1,Math.floor(idx)));
function save(){try{localStorage.setItem('stats-done-v1',JSON.stringify(done));localStorage.setItem('stats-idx-v1',String(idx))}catch(e){}}
function menu(){let h='<div class="tag">学習進捗 '+done.length+' / '+L.length+'</div><div class="progress"><span style="width:'+100*done.length/L.length+'%"></span></div>',last='';L.forEach((l,i)=>{if(l.g!==last){h+='<h3>'+l.g+'</h3>';last=l.g}h+='<button data-i="'+i+'" class="'+(i===idx?'active':'')+'">'+(done.includes(i)?'✓ ':'')+l.n+'</button>'});$('nav').innerHTML=h;$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));$('menu').innerHTML=L.map((l,i)=>'<option value="'+i+'">'+(done.includes(i)?'✓ ':'')+l.g+' / '+l.n+'</option>').join('');$('menu').value=idx}
function go(i){idx=i;save();show();window.scrollTo(0,0)}
function show(){menu();let l=L[idx];$('lesson').innerHTML='<div class="tag">'+l.g+' · '+(idx+1)+' / '+L.length+' · 学習済 '+done.length+'</div><h2>'+l.n+'</h2><h3>何のために使う？</h3><p>'+l.u+'</p><h3>まずはイメージ</h3><p>'+l.i+'</p><section class="example"><div class="tag">身近な具体例（仮定）</div><h3>'+examples[idx][0]+'</h3><p>'+examples[idx][1]+'</p></section><div class="formula">'+mathCards[idx]+'<div class="eq-toolbar"><small>数式の大きさ（横スクロール可）</small><div><button id="eq-sm" aria-label="数式を小さくする">A−</button> <button id="eq-lg" aria-label="数式を大きくする">A＋</button></div></div></div><div class="panel"><div class="tag">実験室 · スライダーを動かしてみよう</div><p class="try-it"><strong>試してみよう</strong> '+examples[idx][2]+'</p>'+(idx===8?'<label class="mode-label" for="normal-mode">色を付ける範囲</label><select id="normal-mode"><option value="central">平均 ± 標準偏差（約68%）</option><option value="cdf">指定した身長以下</option></select>':'')+'<div class="legend">'+examples[idx][3]+'</div><div id="viz"></div><div class="controls">'+l.c.map(c=>'<div class="control"><label for="r-'+c.id+'">'+c.label+' <output id="o-'+c.id+'">'+c.val+'</output></label><input type="range" id="r-'+c.id+'" min="'+c.min+'" max="'+c.max+'" step="'+c.step+'" value="'+c.val+'"></div>').join('')+'</div><div class="live-reading"><div class="tag">今の設定を言葉で読む</div><p id="reading" aria-live="polite"></p></div><button id="reset">初期値に戻す</button></div><div class="quiz"><h3>理解度チェック</h3><p>'+l.q+'</p>'+l.o.map((o,i)=>'<button data-q="'+i+'">'+o+'</button>').join('')+'<p id="feedback" aria-live="polite"></p></div><div class="foot"><button id="prev" '+(idx===0?'disabled':'')+'>← 前へ</button><button class="primary" id="mark">'+(done.includes(idx)?'学習済 ✓':'学習済にする')+'</button><button id="next" '+(idx===L.length-1?'disabled':'')+'>次へ →</button></div>';let eqSize=0;try{eqSize=Number(localStorage.getItem('stats-math-font-v13'))||0}catch(e){}if(!eqSize)eqSize=window.innerWidth<=600?28:30;eqSize=Math.max(20,Math.min(48,eqSize));function sizeMath(){document.documentElement.style.setProperty('--eq-font',eqSize+'px');$('eq-sm').disabled=eqSize<=20;$('eq-lg').disabled=eqSize>=48;try{localStorage.setItem('stats-math-font-v13',String(eqSize))}catch(e){}}$('eq-sm').onclick=()=>{eqSize=Math.max(20,eqSize-3);sizeMath()};$('eq-lg').onclick=()=>{eqSize=Math.min(48,eqSize+3);sizeMath()};sizeMath();function draw(){let v={};l.c.forEach(c=>{v[c.id]=Number($('r-'+c.id).value);$('o-'+c.id).textContent=fmt(v[c.id])});if(idx===8){v.mode=$('normal-mode').value;$('r-c').disabled=v.mode!=='cdf'}$('viz').innerHTML=l.r(v);$('reading').textContent=readings[idx](v)}if(idx===8)$('normal-mode').onchange=draw;l.c.forEach(c=>$('r-'+c.id).oninput=draw);$('reset').onclick=()=>{l.c.forEach(c=>$('r-'+c.id).value=c.val);if(idx===8)$('normal-mode').value='central';draw()};$('lesson').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{let correct=+b.dataset.q===l.k;$('lesson').querySelectorAll('[data-q]').forEach(x=>x.className='');b.className=correct?'good':'bad';$('feedback').textContent=(correct?'正解！ ':'もう一度考えてみよう。 ')+l.w});$('prev').onclick=()=>go(idx-1);$('next').onclick=()=>go(idx+1);$('mark').onclick=()=>{done=done.includes(idx)?done.filter(x=>x!==idx):[...done,idx];save();menu();$('mark').textContent=done.includes(idx)?'学習済 ✓':'学習済にする';$('lesson').querySelector('.tag').textContent=l.g+' · '+(idx+1)+' / '+L.length+' · 学習済 '+done.length};draw()}
$('menu').onchange=e=>go(+e.target.value);show();let compact=window.innerWidth<=700;window.addEventListener('resize',()=>{const next=window.innerWidth<=700;if(next!==compact){compact=next;const control=document.querySelector('#lesson input[type=range]');if(control)control.dispatchEvent(new Event('input'))}});
</script></body></html>
